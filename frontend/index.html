<!DOCTYPE html>

    <div class="bracket">

        <div class="conference">

            <h2>Western Conference</h2>

            <div class="round">

                <div class="matchup">
                    <select class="team west-team"></select>

                </div>

                <div class="matchup">
                    <select class="team west-team"></select>
                    <select class="team west-team"></select>
                </div>

                <div class="matchup">
                    <select class="team west-team"></select>
                    <select class="team west-team"></select>
                </div>

                <div class="matchup">
                    <select class="team west-team"></select>
                    <select class="team west-team"></select>
                </div>

            </div>

        </div>


        <div class="conference">

            <h2>Eastern Conference</h2>

            <div class="round">
                <h3>First Round</h3>

                <div class="matchup">
                    <select class="team east-team"></select>
                    <select class="team east-team"></select>
                </div>

                <div class="matchup">
                    <select class="team east-team"></select>
                    <select class="team east-team"></select>
                </div>

                <div class="matchup">
                    <select class="team east-team"></select>
                    <select class="team east-team"></select>
                </div>

                <div class="matchup">
                    <select class="team east-team"></select>
                    <select class="team east-team"></select>
                </div>

            </div>

        </div>

    </div>

    <h2 id="result"></h2>

    <script src="/frontend/script.js"></script>

</body>
</html>
