<!DOCTYPE html>
<html>
<head>
    <title>NBA Playoff Predictor</title>
    <link rel="stylesheet" href="/frontend/style.css">
</head>

<body>

    <h1>NBA Playoff Predictor</h1>

    <button id="predictButton">Predict Playoffs</button>

    <div class="bracket">

        <!-- WESTERN CONFERENCE -->
        <div class="conference">

            <h2>Western Conference</h2>

            <div class="round">
                <h3>First Round</h3>

                <div class="matchup">
                    <select class="team west-team"></select>
                    <select class="team west-team"></select>
                    <div class="winner west-winner">Winner</div>
                </div>

                <div class="matchup">
                    <select class="team west-team"></select>
                    <select class="team west-team"></select>
                    <div class="winner west-winner">Winner</div>
                </div>

                <div class="matchup">
                    <select class="team west-team"></select>
                    <select class="team west-team"></select>
                    <div class="winner west-winner">Winner</div>
                </div>

                <div class="matchup">
                    <select class="team west-team"></select>
                    <select class="team west-team"></select>
                    <div class="winner west-winner">Winner</div>
                </div>

            </div>


            <div class="round second-round">
                <h3>Second Round</h3>

                <div class="matchup">
                    <div class="auto-team west-round2">Waiting...</div>
                    <div class="auto-team west-round2">Waiting...</div>
                    <div class="winner west-round2-winner">Winner</div>
                </div>

                <div class="matchup">
                    <div class="auto-team west-round2">Waiting...</div>
                    <div class="auto-team west-round2">Waiting...</div>
                    <div class="winner west-round2-winner">Winner</div>
                </div>

            </div>

        </div>


        <!-- EASTERN CONFERENCE -->
        <div class="conference">

            <h2>Eastern Conference</h2>

            <div class="round">
                <h3>First Round</h3>

                <div class="matchup">
                    <select class="team east-team"></select>
                    <select class="team east-team"></select>
                    <div class="winner east-winner">Winner</div>
                </div>

                <div class="matchup">
                    <select class="team east-team"></select>
                    <select class="team east-team"></select>
                    <div class="winner east-winner">Winner</div>
                </div>

                <div class="matchup">
                    <select class="team east-team"></select>
                    <select class="team east-team"></select>
                    <div class="winner east-winner">Winner</div>
                </div>

                <div class="matchup">
                    <select class="team east-team"></select>
                    <select class="team east-team"></select>
                    <div class="winner east-winner">Winner</div>
                </div>

            </div>


            <div class="round second-round">
                <h3>Second Round</h3>

                <div class="matchup">
                    <div class="auto-team east-round2">Waiting...</div>
                    <div class="auto-team east-round2">Waiting...</div>
                    <div class="winner east-round2-winner">Winner</div>
                </div>

                <div class="matchup">
                    <div class="auto-team east-round2">Waiting...</div>
                    <div class="auto-team east-round2">Waiting...</div>
                    <div class="winner east-round2-winner">Winner</div>
                </div>

            </div>

        </div>

    </div>

    <script src="/frontend/script.js"></script>

</body>
</html>
